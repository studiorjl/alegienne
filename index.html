<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALEGIENNE | Coming soon</title>
  <meta name="description" content="Alegienne, a brand dedicated to creating heartfelt artefacts and tea with love. Online soon xo">
  <meta property="og:title" content="ALEGIENNE | Coming soon">
  <meta property="og:description" content="Discover Alegienne, a brand dedicated to creating heartfelt products with love.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="alegienne_gold.png">

  <link rel="icon" type="image/png" href="Alegienne-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap">

  <style>
    :root {
      --ink: #2a211b;
      --muted: #806f61;
      --paper: #f8f4ef;
      --cream: #fffaf3;
      --rose: #d6a9a0;
      --gold: #b8904e;
      --shadow: 0 26px 80px rgba(65, 46, 30, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(214, 169, 160, 0.2), transparent 34rem),
        linear-gradient(145deg, #fffaf3 0%, #f6efe6 48%, #fffdf8 100%);
      font-family: "Libre Baskerville", Georgia, serif;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(28px, 6vw, 80px) clamp(18px, 5vw, 64px);
    }

    .coming-soon {
      width: min(100%, 920px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 3vw, 34px);
      text-align: center;
    }

    .logo {
      width: auto;
      max-width: min(86vw, 620px);
      max-height: 33vh;
      object-fit: contain;
      filter: drop-shadow(0 18px 42px rgba(65, 46, 30, 0.1));
    }

    .divider {
      width: clamp(72px, 14vw, 140px);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(184, 144, 78, 0.85), transparent);
    }

    .tagline {
      margin: 0;
      color: var(--muted);
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(0.82rem, 2.2vw, 1rem);
      line-height: 1.8;
      letter-spacing: 0.05em;
    }

    .signature {
      width: min(54vw, 444px);
      max-height: 18vh;
      object-fit: contain;
      opacity: 0.94;
    }

    @media (max-width: 640px) {
      .page {
        align-items: start;
        padding-top: clamp(52px, 12vh, 92px);
      }

      .logo {
        max-width: 88vw;
        max-height: 50vh;
      }

      .signature {
        width: min(62vw, 260px);
        max-height: 16vh;
      }
    }

    @media (min-width: 1100px) {
      .coming-soon {
        gap: 34px;
      }
    }
  </style>
</head>

<body>
  <main class="page" aria-label="Alegienne coming soon">
    <section class="coming-soon">
      <img src="coming soon_gold_transparent.png" alt="Alegienne Coming Soon" class="logo">

      <div class="divider" aria-hidden="true"></div>

      <p class="tagline">with love, from alegienne x.</p>

      <img src="alegienne_hand_gold_transparent.png" alt="with love from alegienne x" class="signature">
    </section>
  </main>
</body>
</html>
