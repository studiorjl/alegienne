<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plume</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR&display=swap');

    body {
      margin: 0;
      background: #CEAB8F;
      color: #321211;
      font-family: "Courier New", "Noto Serif KR", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 720px;
      padding: 40px;
      text-align: center;
    }

    .logo {
      max-width: 777px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 0.9rem;
      margin-bottom: 10px;
      letter-spacing: 0.08em;
    }

    p {
      font-size: 0.7rem;
      line-height: 1.1;
      opacity: 0.9;
    }

    .highlight {
      background: #FEE6D9;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .divider {
      width: 120px;
      height: 2px;
      background: #FEE6D9;
      margin: 30px auto;
      opacity: 0.8;
    }

    .tagline {
      font-size: 0.9rem;
      opacity: 0.75;
      letter-spacing: 0.05em;
      color: #FEE6D9;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- Plume -->
    <img src="plume.png" alt="Plume" class="logo">

    <h1>well, hello gorgeous</h1>

    <div class="divider"></div>

    <p>
     <i>plume</i>; a botanical smoke blend for <span class="highlight">heroines.</span>
    </p>

    <p>
      roll me,<br>
      <i>smoulder</i> me. <br>
      suck me, blow me.
    </p>

    <div class="divider"></div>

    <p class="tagline">
      <br><br> with love, from alegienne x.
    </p>

  </div>
</body>
</html>
